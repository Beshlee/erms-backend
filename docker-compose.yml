# Bonus (Bölüm 8.3) — "Docker: uygulama ve veritabanı için docker-compose ile ayağa
# kaldırma." Tek komutla API + SQL Server'ı çalıştırır: `docker compose up --build`.
#
# ASPNETCORE_ENVIRONMENT=Development bilinçli olarak ayarlı — Program.cs, yalnızca
# Development ortamında migration'ları otomatik uygulayıp örnek veriyi (seed) ekliyor,
# böylece container ilk ayağa kalkışında elle "dotnet ef database update" gerekmiyor.
#
# ⚠️ Review bulgusu düzeltmesi: SA parolası ve JWT secret'ı artık burada SABİT bir değere
# düşmüyor (":-varsayılan" yerine ":?hata mesajı" kullanılıyor) — "docker compose up" bu
# değerler bir .env dosyasında tanımlı DEĞİLSE hatayla durur. Kendi değerlerini kullanmak
# için: `cp .env.example .env` sonra .env içindeki CHANGE_ME değerlerini doldur (.env
# .gitignore'da, asla commit'lenmez).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?SQL_SA_PASSWORD tanımlı değil — .env dosyanı .env.example'dan oluştur.}
    ports:
      - "1433:1433"
    volumes:
      - erms-sqlserver-data:/var/opt/mssql
    healthcheck:
      # "api" servisinin SQL Server tam olarak bağlantı kabul etmeye başlamadan
      # ayağa kalkmaya çalışmasını (ve migration'ın başarısız olmasını) önler.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/ERMS.Api/Dockerfile
    container_name: erms-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ErmsDb;User Id=sa;Password=${SQL_SA_PASSWORD:?SQL_SA_PASSWORD tanımlı değil — .env dosyanı .env.example'dan oluştur.};TrustServerCertificate=True"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET tanımlı değil — .env dosyanı .env.example'dan oluştur.}
      Jwt__Issuer: ErmsApi
      Jwt__Audience: ErmsClient
      Jwt__ExpiryMinutes: "60"
      # erms-frontend container dışında (host'ta) çalışıyorsa varsayılan adres.
      AllowedOrigins__0: http://localhost:4200
    ports:
      - "8080:8080"

volumes:
  erms-sqlserver-data:
